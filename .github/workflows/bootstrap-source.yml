name: Amend bootstrap checkpoint

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  amend-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0

      - name: Record failed restore and correct Task 0 verification design
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          text = path.read_text(encoding='utf-8')

          note = '- Task 0 is baseline restoration/test scaffolding only and does not change production behavior; its gate is source-hash parity plus passing baseline verification. TDD RED begins with Task 1.\n'
          anchor = '- If an assumption about a PDF representation is disproved, stop and amend the plan/design before proceeding.\n'
          if note not in text:
              text = text.replace(anchor, anchor + note)

          replacement = '''- [ ] **Step 0.3: Add a baseline verification test for restored entrypoints and repository layout.**\n\n  This is a non-behavioral baseline/scaffolding task. Do not fabricate a RED failure after source restoration; source SHA-256 parity is the restore gate and the baseline test must pass.\n\n```python\nfrom pathlib import Path\n\n\ndef test_expected_desktop_entrypoints_exist():\n    root = Path(__file__).resolve().parents[1]\n    assert (root / "desktop_app.py").is_file()\n    assert (root / "native_api.py").is_file()\n    assert (root / "backend" / "service.py").is_file()\n    assert (root / "backend" / "engine" / "pdf_pipeline.py").is_file()\n    assert (root / "frontend" / "static" / "app.js").is_file()\n```\n\n- [ ] **Step 0.4: Add the minimum pytest/CI scaffolding without changing production behavior.**\n\n  CI workflow runs on pushes/PRs and installs the project dependencies plus pytest, then executes `python -m pytest -q`.\n\n- [ ] **Step 0.5: Run the focused baseline verification and confirm PASS.**\n\n  Run: `python -m pytest tests/test_baseline_imports.py -q`\n\n'''
          pattern = r'- \[ \] \*\*Step 0\.3:.*?(?=- \[ \] \*\*Step 0\.6:)'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate Task 0.3–0.5 block exactly once')

          row = '| 2026-09-10 | Task 0 restore attempt | `c20e376a714c90c91d4f6a36953eb5c83d874a5b` / Actions `34414250113` | `xz --test` failed: `Unexpected end of input` | Bootstrap transport on GitHub had only 8 of 17 archive chunks. No production source was changed; restore strategy must be corrected before continuing. |\n'
          if row not in text:
              marker = '| 2026-09-10 | Governance | `9ec5cd02a1d38fc0af5cf248d0ecd947f867f792` | `AGENTS.md` added | Execution gates codified before production refactor. |\n'
              text = text.replace(marker, marker + row)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit plan amendment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md
          git commit -m "docs: record Task 0 restore failure and verification gate"
          git push origin HEAD:refactor/pdf-cleaner-v2
