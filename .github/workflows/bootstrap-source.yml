name: Bootstrap source snapshot

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0

      - name: Reconstruct compressed baseline
        shell: bash
        run: |
          set -euo pipefail
          test -d _bootstrap
          test "$(find _bootstrap -maxdepth 1 -name 'part-*.b64' | wc -l)" -gt 0
          cat _bootstrap/part-*.b64 | base64 --decode > /tmp/pdf-cleaner-baseline.tar.xz
          xz --test /tmp/pdf-cleaner-baseline.tar.xz
          mkdir -p /tmp/pdf-cleaner-restore
          tar -xJf /tmp/pdf-cleaner-baseline.tar.xz -C /tmp/pdf-cleaner-restore

          if [ -d /tmp/pdf-cleaner-restore/PDF_Cleaner ]; then
            cp -a /tmp/pdf-cleaner-restore/PDF_Cleaner/. ./
          else
            first_dir="$(find /tmp/pdf-cleaner-restore -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$first_dir" ] && [ "$(find /tmp/pdf-cleaner-restore -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ]; then
              cp -a "$first_dir"/. ./
            else
              cp -a /tmp/pdf-cleaner-restore/. ./
            fi
          fi

          test -f backend/service.py
          test -f backend/engine/pdf_pipeline.py
          test -f native_api.py
          test -f frontend/static/app.js
          test -f desktop_app.py

      - name: Remove bootstrap transport artifacts
        shell: bash
        run: |
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit restored baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "chore: restore PDF Cleaner source baseline"
          git push origin HEAD:refactor/pdf-cleaner-v2
