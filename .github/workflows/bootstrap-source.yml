name: Recover baseline from existing bootstrap

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  recover-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0

      - name: Recover all complete tar members from partial xz stream
        shell: bash
        run: |
          set -euo pipefail
          test -d _bootstrap
          cat _bootstrap/part-*.b64 | base64 --decode > /tmp/partial.tar.xz
          mkdir -p /tmp/recover
          set +e
          xz -dc /tmp/partial.tar.xz > /tmp/partial.tar
          xz_status=$?
          set -e
          echo "xz_status=$xz_status (non-zero is expected for truncated transport)"
          tar -tf /tmp/partial.tar > /tmp/tar-list.txt 2>/tmp/tar-list.err || true
          echo "Recovered tar member list:"
          cat /tmp/tar-list.txt || true
          tar -xf /tmp/partial.tar -C /tmp/recover --ignore-zeros 2>/tmp/tar-extract.err || true

          src=""
          if [ -d /tmp/recover/PDF_Cleaner ]; then
            src=/tmp/recover/PDF_Cleaner
          else
            src="$(find /tmp/recover -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          fi
          test -n "$src"
          cp -a "$src"/. ./

          echo "Recovered source files:"
          find backend frontend -type f 2>/dev/null | sort || true
          find . -maxdepth 1 -type f | sort || true

      - name: Commit recovered complete source members only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PDF_Cleaner_App.vbs README.md backend desktop_app.py frontend native_api.py run_windows.bat 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No recoverable source members found."
            exit 0
          fi
          git commit -m "chore: recover source baseline from bootstrap transport"
          git push origin HEAD:refactor/pdf-cleaner-v2
