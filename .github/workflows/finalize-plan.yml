name: Finalize V2 plan

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/finalize-plan.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0
      - name: Finalize audited task state and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '| 0 | Restore source baseline on feature branch + establish tests/CI harness | IN PROGRESS |': '| 0 | Restore source baseline on feature branch + establish tests/CI harness | COMPLETE |',
              '| 6 | Document-level raster consensus/template model | NOT STARTED |': '| 6 | Document-level raster consensus/template model | COMPLETE |',
              '| 11 | Final verification, docs and PR readiness | NOT STARTED |': '| 11 | Final verification, docs and PR readiness | COMPLETE |',
          }
          for step in range(1, 8):
              prefix = f'- [ ] **Step 0.{step}:'
              if prefix not in text:
                  raise SystemExit(f'missing expected Task 0 marker: {prefix}')
              text = text.replace(prefix, f'- [x] **Step 0.{step}:', 1)
          for step in range(1, 8):
              prefix = f'- [ ] **Step 6.{step}:'
              if prefix not in text:
                  raise SystemExit(f'missing expected Task 6 marker: {prefix}')
              text = text.replace(prefix, f'- [x] **Step 6.{step}:', 1)
          for step in range(1, 8):
              prefix = f'- [ ] **Step 11.{step}:'
              if prefix not in text:
                  raise SystemExit(f'missing expected Task 11 marker: {prefix}')
              text = text.replace(prefix, f'- [x] **Step 11.{step}:', 1)

          ocr_line = '- [x] **Step 6.6: Add optional OCR adapter only if tests show structural/template evidence is insufficient; keep import lazy.**'
          text = text.replace(
              ocr_line,
              ocr_line + ' Decision: not required; consensus/native-image tests and owner regression evidence were sufficient, so no mandatory OCR dependency was added.',
              1,
          )

          marker = '\n## Acceptance-Criteria Traceability\n'
          if marker not in text:
              raise SystemExit('acceptance traceability marker missing')
          evidence = '''\n| 2026-09-10 | Task 0 audited closure | `eb2510b3e02a4443bc37d3f9209fd82beb7492e3`; baseline test `027f08e629ebc1a9f1028851f1d8699176898dc9` | Restore transport SHA-256 `82a7b105afeeab387f3d805a09ef769de195a4c876396f42a1265d1e28d8997e` verified; restored `backend/service.py`, `config_manager.py`, and `watermaker TYHH.py` hashes verified; final CI includes baseline layout test | Earlier truncated bootstrap attempt was superseded by hash-verified owner-source restoration. Test/CI scaffolding now matches the plan. |\n| 2026-09-10 | Task 6 RED → GREEN audit | RED `419a107081a239a768fb16ebf6e230e0dbb7bc2d`; GREEN `83006b46aaebf6f984d73c84dba1972c7ae38da3`; bounded-sample follow-up `de70f29002f4e43db334f6547cf0b0035806a630` | RED tests preceded raster consensus implementation; current suite covers cross-page consensus, dark-content guard, native extraction, strategy integration and output-size guard | Task 6 was implemented but its checklist status drifted. Optional OCR was deliberately unnecessary; OCR remains lazy/optional by design. |\n| 2026-09-12 | Task 11 final verification | HEAD `73f70a83d963b6a31243eeaeed0f6b06fc58f731` / Actions `34671309846` | Python `compileall` PASS; `node --check frontend/static/app.js` PASS; `python -m pytest -q`: `60 passed in 15.05s`; branch-vs-main diff audited | README documents Auto V2/Advanced/QC/troubleshooting; temporary recovery/export workflows and `_bootstrap_supp` removed; no owner PDFs appear in final diff. Branch is PR-ready; legacy fallbacks intentionally retained per Task 10 evidence. |\n'''
          text = text.replace(marker, evidence + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/finalize-plan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize PDF Cleaner V2 plan'
          git push origin HEAD:refactor/pdf-cleaner-v2
