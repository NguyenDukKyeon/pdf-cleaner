name: Restore legacy source

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - '_restore_v2/**'
      - '.github/workflows/restore-legacy-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore tdm_cleaner source
        shell: bash
        run: |
          set -euo pipefail
          cat _restore_v2/00.b64 _restore_v2/01a.b64 _restore_v2/01b.b64 _restore_v2/01c.b64 _restore_v2/01d.b64 _restore_v2/02.b64 | base64 -d > /tmp/missing-tdm.tar.xz
          echo '68c00345508aaace38e92897b7ab7ee4298456583039bca74abb00100b20eb0f  /tmp/missing-tdm.tar.xz' | sha256sum -c -
          tar -xJf /tmp/missing-tdm.tar.xz -C .
          test -f backend/engine/tdm_cleaner/config/manager.py
          test -f backend/engine/tdm_cleaner/core/worker_pool.py
          test -f backend/engine/tdm_cleaner/core/pipeline.py
          test -f backend/engine/tdm_cleaner/processors/factory.py
          rm -rf _restore_v2 _restore_tdm
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No restore changes to commit.'
            exit 0
          fi
          git commit -m 'chore: restore legacy tdm_cleaner source'
          git push origin HEAD:refactor/pdf-cleaner-v2
