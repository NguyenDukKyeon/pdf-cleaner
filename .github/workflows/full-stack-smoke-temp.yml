name: Full Stack Smoke Temp

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2

jobs:
  ubuntu-full-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v4
        with:
          ref: d2ba1eb9284fe37553b0d24f1626d053140f1726

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Syntax and bridge smoke
        run: |
          python -m compileall -q backend desktop_app.py native_api.py
          node --check frontend/static/app.js
          python - <<'PY'
          from native_api import NativeApi
          api = NativeApi()
          assert api.ping() == {"ok": True, "mode": "native", "server": False}
          cfg = api.get_config()
          assert isinstance(cfg, dict) and "config" in cfg
          print("NativeApi -> backend.service bridge smoke: PASS")
          PY

      - name: Focused end-to-end backend paths
        run: python -m pytest -q tests/integration/test_end_to_end_v2.py tests/unit/test_native_api_contract.py tests/frontend/test_frontend_contract.py

      - name: Full Python suite
        run: python -m pytest -q

      - name: Install Playwright package
        run: npm install --no-save playwright@1.55.0

      - name: Render frontend and exercise primary flow
        shell: bash
        run: |
          python -m http.server 8123 --directory frontend >/tmp/pdf-cleaner-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true, channel: 'chrome' });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
            page.on('pageerror', err => consoleErrors.push(String(err)));

            await page.addInitScript(() => {
              let pollCount = 0;
              window.pywebview = {
                api: {
                  get_config: async () => ({
                    config: {
                      common: {
                        quality_profile: 'balanced', content_profile: 'auto', dpi: 240,
                        output_pdf_dpi: 240, jpeg_quality: 92, output_grayscale: false,
                        same_folder: true, overwrite: false, suffix: '_clean', output_dir: ''
                      },
                      modes: { ly: {}, toan: {}, hoa: {}, ebook: {} },
                      speed: {},
                      qc: {}
                    },
                    presets: {}
                  }),
                  save_settings: async () => ({ ok: true }),
                  reset_settings: async () => ({ ok: true }),
                  choose_local_files: async () => ({
                    files: [{ path: '/tmp/qa.pdf', name: 'qa.pdf', size: 12345, parent_dir: '/tmp' }]
                  }),
                  choose_output_dir: async () => ({ path: '/tmp' }),
                  start_process: async payload => {
                    if (!payload.paths || payload.paths.length !== 1) throw new Error('missing paths');
                    if (payload.mode !== 'auto') throw new Error('mode is not auto');
                    return { job_id: 'qa-job' };
                  },
                  poll_job: async () => {
                    pollCount += 1;
                    return {
                      events: [
                        { type: 'stage', stage: 'ANALYZING', percent: 15, document_kind: 'vector', watermark_family: 'TAILIEUONTHI.NET', strategy: 'stream_remove', confidence: 0.99 },
                        { type: 'stage', stage: 'PLANNING', percent: 30, strategy: 'stream_remove', confidence: 0.99 },
                        { type: 'stage', stage: 'PROCESSING', percent: 55, strategy: 'stream_remove', confidence: 0.99 },
                        { type: 'progress', percent: 75, file_index: 1, file_total: 1, page_done: 3, page_total: 4, message: 'Đang xử lý' },
                        { type: 'stage', stage: 'VERIFYING', percent: 90, strategy: 'stream_remove', confidence: 0.99 },
                        { type: 'qc', message: 'QC đạt', level: 'success', report: { worker_count: 2, native_image_pages: 0, ocr_calls: 0 }, summary: { ok: true } },
                        { type: 'done', message: 'Hoàn tất', level: 'success', outputs: ['/tmp/qa_clean.pdf'] }
                      ],
                      last_event_id: 7,
                      stage: 'DONE',
                      terminal: true,
                      qc_report: { ok: true }
                    };
                  },
                  cancel_job: async () => ({ ok: true }),
                  open_latest_file: async () => ({ ok: true }),
                  open_latest_folder: async () => ({ ok: true }),
                  open_log: async () => ({ ok: true }),
                  open_tool_dir: async () => ({ ok: true })
                }
              };
            });

            await page.goto('http://127.0.0.1:8123/index.html', { waitUntil: 'networkidle' });
            assert.match(await page.title(), /PDF/i);
            await page.waitForFunction(() => document.querySelector('#logConsole')?.textContent.includes('sẵn sàng'));
            assert.ok((await page.locator('body').innerText()).length > 200, 'page rendered blank');

            await page.locator('#chooseLocalFiles').click();
            await page.waitForFunction(() => document.querySelector('#fileCount')?.textContent.includes('1 file'));
            await page.locator('#contentProfile').selectOption('math');
            await page.locator('#startBtn').click();
            await page.waitForFunction(() => document.querySelector('#statusText')?.textContent.includes('Hoàn tất'));

            assert.equal(await page.locator('#analysisRepresentation').innerText(), 'Vector');
            assert.equal(await page.locator('#analysisStrategy').innerText(), 'Stream remove');
            assert.equal(await page.locator('#analysisConfidence').innerText(), '99%');
            assert.equal(await page.locator('#openFileBtn').isEnabled(), true);
            assert.match(await page.locator('#lastOutput').innerText(), /qa_clean\.pdf/);
            assert.equal(consoleErrors.length, 0, `console errors: ${consoleErrors.join(' | ')}`);

            await page.screenshot({ path: 'full-stack-smoke.png', fullPage: true });
            console.log('Rendered frontend + primary interaction flow: PASS');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload frontend smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-smoke-screenshot
          path: full-stack-smoke.png

  windows-desktop-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v4
        with:
          ref: d2ba1eb9284fe37553b0d24f1626d053140f1726

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Windows native desktop bridge smoke
        shell: pwsh
        run: |
          python -m compileall -q backend desktop_app.py native_api.py
          python -c "import webview; from native_api import NativeApi; api=NativeApi(); assert api.ping()['mode']=='native'; w=webview.create_window('PDF Cleaner QA', 'frontend/index.html', js_api=api, hidden=True); api.bind_window(w); assert w is not None; print('Windows pywebview window construction + NativeApi binding: PASS')"
          python -m pytest -q tests/unit/test_native_api_contract.py tests/frontend/test_frontend_contract.py
