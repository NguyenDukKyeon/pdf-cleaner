name: Record Task 5 checkpoint

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/task5-checkpoint.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0
      - name: Update implementation plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| 5 | Native raster image extraction + synthetic raster fixtures | NOT STARTED |', '| 5 | Native raster image extraction + synthetic raster fixtures | COMPLETE |')
          for step in ('5.1', '5.2', '5.3', '5.4', '5.5', '5.6'):
              s = s.replace(f'- [ ] **Step {step}:', f'- [x] **Step {step}:')
          rows = (
              '| 2026-09-10 | Task 5 RED | `1322e7a0` | Local focused pytest collection failed with `ModuleNotFoundError: backend.engine.raster` | Expected RED committed before raster fast-path implementation. |\n'
              '| 2026-09-10 | Task 5 GREEN | `d454da2c` | Local: focused `4 passed`; full suite `31 passed`; raster compile PASS | Native XObject extraction implemented; tests forbid `Page.get_pixmap`, proving no page render on eligible pages. |\n'
          )
          marker = '## Acceptance-Criteria Traceability'
          pos = s.index(marker)
          for row in rows:
              if row not in s:
                  s = s[:pos] + row + '\n' + s[pos:]
                  pos += len(row) + 1
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/task5-checkpoint.yml
      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record Task 5 verification checkpoint"
          git push origin HEAD:refactor/pdf-cleaner-v2
