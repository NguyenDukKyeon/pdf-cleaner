name: Record Task 2 checkpoint

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/task2-checkpoint.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0
      - name: Update implementation plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| 2 | Structural/raster document analysis + signature registry | NOT STARTED |', '| 2 | Structural/raster document analysis + signature registry | COMPLETE |')
          for step in ('2.1', '2.2', '2.3', '2.4', '2.5', '2.6'):
              s = s.replace(f'- [ ] **Step {step}:', f'- [x] **Step {step}:')
          rows = (
              '| 2026-09-10 | Task 2 RED | `2b7a80dd` | Local focused pytest collection failed because `signatures` / `analyze_document` were absent | Expected RED committed before implementation. |\n'
              '| 2026-09-10 | Task 2 GREEN | `c357c498` | Local: focused `5 passed`; full suite `17 passed`; analyzer/signature `compileall` PASS | Added sampled stream/image analysis, vector/raster/hybrid classification, data-driven TaiLieuOnThi signature evidence. |\n'
          )
          marker = '## Acceptance-Criteria Traceability'
          pos = s.index(marker)
          for row in rows:
              if row not in s:
                  s = s[:pos] + row + '\n' + s[pos:]
                  pos += len(row) + 1
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/task2-checkpoint.yml
      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record Task 2 verification checkpoint"
          git push origin HEAD:refactor/pdf-cleaner-v2
