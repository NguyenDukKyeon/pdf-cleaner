name: Record Task 3 checkpoint

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/task3-checkpoint.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0
      - name: Update implementation plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| 3 | Deterministic watermark router + processing plans | NOT STARTED |', '| 3 | Deterministic watermark router + processing plans | COMPLETE |')
          for step in ('3.1', '3.2', '3.3', '3.4', '3.5'):
              s = s.replace(f'- [ ] **Step {step}:', f'- [x] **Step {step}:')
          rows = (
              '| 2026-09-10 | Task 3 RED | `f2e4f090` | Local router tests failed with `ModuleNotFoundError: backend.engine.router` | Expected RED committed before production router. |\n'
              '| 2026-09-10 | Task 3 GREEN | `1a73e1c1` | Local: router `8 passed`; full suite `25 passed`; router compile PASS | Deterministic pure router added; content profile remains a safety hint and cannot hard-route engines. |\n'
          )
          marker = '## Acceptance-Criteria Traceability'
          pos = s.index(marker)
          for row in rows:
              if row not in s:
                  s = s[:pos] + row + '\n' + s[pos:]
                  pos += len(row) + 1
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/task3-checkpoint.yml
      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record Task 3 verification checkpoint"
          git push origin HEAD:refactor/pdf-cleaner-v2
