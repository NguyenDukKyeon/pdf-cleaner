name: Export source snapshot
on:
  push:
    branches: [refactor/pdf-cleaner-v2]
    paths:
      - .github/workflows/export-source.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          tar --exclude=.git --exclude=_bootstrap --exclude=_bootstrap_supp -czf /tmp/pdf-cleaner-source.tgz .
          sha256sum /tmp/pdf-cleaner-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-cleaner-source
          path: /tmp/pdf-cleaner-source.tgz
          if-no-files-found: error
          retention-days: 1
