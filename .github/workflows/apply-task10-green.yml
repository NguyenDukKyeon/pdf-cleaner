name: Apply Task 10 green payload
on:
  push:
    branches: [refactor/pdf-cleaner-v2]
    paths:
      - _task10_green_payload.tgz
      - .github/workflows/apply-task10-green.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply payload
        run: tar -xzf _task10_green_payload.tgz
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Verify Task 10 green payload
        run: |
          python -m pytest -q
          python -m compileall -q backend native_api.py desktop_app.py scripts/benchmark_v2.py
      - name: Commit verified Task 10 implementation
        run: |
          rm -f _task10_green_payload.tgz .github/workflows/apply-task10-green.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: harden Task 10 raster cleanup and benchmark'
          git push
