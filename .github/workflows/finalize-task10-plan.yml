name: Finalize Task 10 plan
on:
  push:
    branches: [refactor/pdf-cleaner-v2]
    paths:
      - .github/workflows/finalize-task10-plan.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize Task 10 status and CI evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          text = path.read_text(encoding='utf-8')
          old = '| 10 | Regression benchmark, hardening and legacy-removal decision | READY FOR FINAL CI |'
          new = '| 10 | Regression benchmark, hardening and legacy-removal decision | COMPLETE |'
          if old not in text:
              raise SystemExit('Task 10 is not in READY FOR FINAL CI state')
          text = text.replace(old, new, 1)

          evidence = "| 2026-09-12 | Task 10 final CI gate | `4fd6beb39de12e609e71698640486092f218ca0b` / Actions `34670226489` | Normal branch `Tests` workflow SUCCESS after verified implementation and plan checkpoint | Task 10 completion gate satisfied without relaxing residual, outside-change, output-size, regression-test, or benchmark requirements. |"
          if evidence in text:
              raise SystemExit('Final Task 10 CI evidence already exists unexpectedly')
          marker = '\n## Acceptance-Criteria Traceability'
          if marker not in text:
              raise SystemExit('Acceptance-Criteria Traceability marker missing')
          before, after = text.split(marker, 1)
          text = before.rstrip() + '\n' + evidence + '\n\n## Acceptance-Criteria Traceability' + after
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Verify finalized Task 10 state
        run: |
          python -m pytest -q
          python -m compileall -q backend native_api.py desktop_app.py scripts/benchmark_v2.py
      - name: Commit final Task 10 plan
        run: |
          rm -f .github/workflows/finalize-task10-plan.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: mark Task 10 complete'
          git push
