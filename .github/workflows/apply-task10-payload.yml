name: Apply Task 10 verified payload
on:
  push:
    branches: [refactor/pdf-cleaner-v2]
    paths:
      - _task10_payload/**
      - .github/workflows/apply-task10-payload.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reassemble and verify payload
        run: |
          cat _task10_payload/*.b64 > /tmp/task10_payload.b64
          echo '8beff03d29325e742aa373b0cf8f5c3c321f8e50f2218c02cf29e3f4aa37c0ea  /tmp/task10_payload.b64' | sha256sum -c -
          base64 -d /tmp/task10_payload.b64 > /tmp/task10_payload.tgz
          echo '52974bf267c2b89288f4e9de0637ce63b8f05f898ee455c0d2fc6c7581e42dc4  /tmp/task10_payload.tgz' | sha256sum -c -
          tar -xzf /tmp/task10_payload.tgz
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Verify Task 10 implementation
        run: |
          python -m pytest -q
          python -m compileall -q backend native_api.py desktop_app.py scripts/benchmark_v2.py
      - name: Commit verified implementation
        run: |
          rm -rf _task10_payload
          rm -f _task10_green_payload.tgz
          rm -f .github/workflows/apply-task10-green.yml
          rm -f .github/workflows/apply-task10-payload.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: complete Task 10 raster hardening and benchmark'
          git push
