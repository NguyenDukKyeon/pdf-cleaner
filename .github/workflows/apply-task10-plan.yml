name: Apply Task 10 plan checkpoint
on:
  push:
    branches: [refactor/pdf-cleaner-v2]
    paths:
      - .github/workflows/apply-task10-plan.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Task 10 plan evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          text = path.read_text(encoding='utf-8')

          old_status = '| 10 | Regression benchmark, hardening and legacy-removal decision | NOT STARTED |'
          new_status = '| 10 | Regression benchmark, hardening and legacy-removal decision | READY FOR FINAL CI |'
          if old_status not in text:
              raise SystemExit('Task 10 progress row is not in the expected pre-checkpoint state')
          text = text.replace(old_status, new_status, 1)

          for step in range(1, 8):
              old = f'- [ ] **Step 10.{step}:'
              new = f'- [x] **Step 10.{step}:'
              if old not in text:
                  raise SystemExit(f'Task 10.{step} checkbox is not in the expected state')
              text = text.replace(old, new, 1)

          evidence = "| 2026-09-12 | Task 10 GREEN + benchmark | `b6dd6dd43c34509e5589a97e708329bb68b4cfad` / Actions `34669911933` | Payload SHA-256 verified; `python -m pytest -q`: `59 passed in 11.39s`; `compileall` PASS; four owner-input benchmark runs recorded locally | Added TDM-guided TaiLieuOnThi raster cleanup, residual QC gate `<= 0.08`, native-pixel preservation outside trusted watermark zones, output-size guard, and benchmark report. All four V2 inputs passed QC; keep all legacy engines as compatibility fallbacks. |"
          if evidence in text:
              raise SystemExit('Task 10 execution evidence already exists unexpectedly')
          marker = '\n## Acceptance-Criteria Traceability'
          if marker not in text:
              raise SystemExit('Acceptance-Criteria Traceability marker missing')
          before, after = text.split(marker, 1)
          text = before.rstrip() + '\n' + evidence + '\n\n## Acceptance-Criteria Traceability' + after
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Verify Task 10 checkpoint
        run: |
          python -m pytest -q
          python -m compileall -q backend native_api.py desktop_app.py scripts/benchmark_v2.py
      - name: Commit plan checkpoint
        run: |
          rm -f _task10_plan_b64.tmp _task10_plan_placeholder.tmp
          rm -f .github/workflows/apply-task10-plan.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: checkpoint Task 10 verification'
          git push
