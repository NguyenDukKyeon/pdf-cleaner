name: Record Task 1 GREEN checkpoint

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/task1-green-checkpoint.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0
      - name: Update implementation plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| 1 | Typed analyzer models + representative-page sampling | IN PROGRESS |', '| 1 | Typed analyzer models + representative-page sampling | COMPLETE |')
          for step in ('1.4', '1.5', '1.6'):
              s = s.replace(f'- [ ] **Step {step}:', f'- [x] **Step {step}:')
          row = '| 2026-09-10 | Task 1 GREEN | `ad2595f6` | Local: focused `11 passed`; full suite `12 passed`; `compileall` analyzer PASS | Typed models and deterministic representative-page sampler implemented after verified RED. |\n'
          marker = '## Acceptance-Criteria Traceability'
          if row not in s:
              pos = s.index(marker)
              s = s[:pos] + row + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/task1-green-checkpoint.yml
      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record Task 1 GREEN checkpoint"
          git push origin HEAD:refactor/pdf-cleaner-v2
