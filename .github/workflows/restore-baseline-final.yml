name: Restore baseline final

on:
  push:
    branches: [refactor/pdf-cleaner-v2]
    paths:
      - '_restore_baseline/**'
      - '.github/workflows/restore-baseline-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore owner source files with hash verification
        shell: bash
        run: |
          set -euo pipefail
          cat _restore_baseline/00.b64 _restore_baseline/01.b64 _restore_baseline/02.b64 | base64 -d > /tmp/baseline-missing.tar.xz
          echo '82a7b105afeeab387f3d805a09ef769de195a4c876396f42a1265d1e28d8997e  /tmp/baseline-missing.tar.xz' | sha256sum -c -
          tar -xJf /tmp/baseline-missing.tar.xz -C .
          echo '73da64e57de08ca4f59c16aabe18ff9c9077d671283a7a700e979b9b8521f94e  backend/service.py' | sha256sum -c -
          echo '6a7683c58a154e1cc4c06445520ac39973ea8a182accddf001bc7d127da0d635  backend/engine/config_manager.py' | sha256sum -c -
          echo '1231208422ebbf8fb2c45574759d7cc9cf2433191043b7c8de524d5f1dbc0ab3  backend/engine/watermaker TYHH.py' | sha256sum -c -
          rm -rf _restore_baseline
          rm -f .github/workflows/restore-baseline-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: restore remaining owner baseline source'
          git push origin HEAD:refactor/pdf-cleaner-v2
