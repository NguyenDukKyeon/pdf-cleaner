name: Apply Task 9 Auto-first UI

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/apply-task9.yml

permissions:
  contents: write

jobs:
  apply-task9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Apply Task 9 production changes
        run: python .github/task9_apply.py

      - name: Verify syntax
        run: |
          python -m py_compile native_api.py
          node --check frontend/static/app.js

      - name: Verify Task 9 focused contracts
        run: python -m pytest tests/unit/test_native_api_contract.py tests/frontend/test_frontend_contract.py -q

      - name: Verify full suite
        run: python -m pytest -q

      - name: Commit Task 9 production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native_api.py frontend/index.html frontend/static/app.js frontend/static/styles.css
          git commit -m "feat: make desktop UI Auto-first"
          echo "GREEN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Update Task 9 plan checkpoint
        env:
          RED_SHA: d460902bf0586bf68c625ff492012113fe9a5def
          RED_RUN: '34483893202'
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '| 9 | pywebview API + Auto-first frontend UX/progress/report | NOT STARTED |',
              '| 9 | pywebview API + Auto-first frontend UX/progress/report | COMPLETE |',
              1,
          )
          for step in range(1, 7):
              text = text.replace(f'- [ ] **Step 9.{step}:', f'- [x] **Step 9.{step}:', 1)

          red_row = (
              f"| 2026-09-10 | Task 9 RED | `{os.environ['RED_SHA']}` / Actions `{os.environ['RED_RUN']}` "
              "| Task 9 contracts: `3 failed, 42 passed` "
              "| Expected RED: primary UI still selected subject engines, no V2 stage diagnostics, and native start payload omitted Auto defaults. |\n"
          )
          green_row = (
              f"| 2026-09-10 | Task 9 GREEN | `{os.environ['GREEN_SHA']}` / Actions `{os.environ['GITHUB_RUN_ID']}` "
              "| `py_compile` PASS; `node --check` PASS; focused Task 9 `4 passed`; full suite `45 passed` "
              "| Auto-first desktop workflow, Advanced content-protection profile, V2 stage timeline and report diagnostics implemented while preserving native job bridge. |\n"
          )
          anchor = '\n## Acceptance-Criteria Traceability\n'
          if anchor not in text:
              raise SystemExit('execution log anchor missing')
          if red_row not in text:
              text = text.replace(anchor, '\n' + red_row + green_row + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit plan checkpoint and push
        run: |
          git add docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md
          git commit -m "docs: mark Task 9 verified"
          git push origin HEAD:refactor/pdf-cleaner-v2
