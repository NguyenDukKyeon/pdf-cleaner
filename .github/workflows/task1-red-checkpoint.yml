name: Record Task 1 RED checkpoint

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/task1-red-checkpoint.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0
      - name: Update implementation plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/plans/2026-09-10-pdf-cleaner-v2.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| 1 | Typed analyzer models + representative-page sampling | NOT STARTED |', '| 1 | Typed analyzer models + representative-page sampling | IN PROGRESS |')
          for step in ('1.1', '1.2', '1.3'):
              s = s.replace(f'- [ ] **Step {step}:', f'- [x] **Step {step}:')
          row = '| 2026-09-10 | Task 1 RED | `2134294e` + `08b5925e` | Local focused pytest collection fails with `ModuleNotFoundError: backend.engine.analyzer` | Expected RED: analyzer package does not exist yet; production code not written before tests. |\n'
          marker = '## Acceptance-Criteria Traceability'
          if row not in s:
              pos = s.index(marker)
              s = s[:pos] + row + '\n' + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/task1-red-checkpoint.yml
      - name: Commit checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record Task 1 RED checkpoint"
          git push origin HEAD:refactor/pdf-cleaner-v2
