name: Apply Task 8 service integration

on:
  push:
    branches:
      - refactor/pdf-cleaner-v2
    paths:
      - .github/workflows/apply-task8-service.yml

permissions:
  contents: write

jobs:
  apply-task8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pdf-cleaner-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Apply Task 8 service facade
        run: python .github/task8_apply.py

      - name: Verify syntax
        run: python -m py_compile backend/service.py backend/app/*.py backend/engine/qc_v2/*.py

      - name: Verify Task 8 focused tests
        run: python -m pytest tests/unit/test_qc_v2.py tests/integration/test_atomic_service.py -q

      - name: Verify full suite
        run: python -m pytest -q

      - name: Commit verified Task 8 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/service.py
          git commit -m "feat: route Auto desktop jobs through V2 safely"
          git push origin HEAD:refactor/pdf-cleaner-v2
